<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KorfClock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
    }
    h1 {
      font-size: 3rem;
      letter-spacing: 0.1em;
      color: #00ff88;
    }
    p { font-size: 1.1rem; color: #888; margin-bottom: 1rem; }
    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    a {
      display: inline-block;
      padding: 1rem 2.5rem;
      border-radius: 0.5rem;
      font-size: 1.3rem;
      font-weight: bold;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
    .btn-controller {
      background: #0077ff;
      color: #fff;
    }
    .btn-display {
      background: #00ff88;
      color: #111;
    }
  </style>
</head>
<body>
  <h1>⏱ KorfClock</h1>
  <p>Real-time korfball shot clock system</p>
  <div class="links">
    <a class="btn-controller" href="/controller">🎮 Controller</a>
    <a class="btn-display"    href="/display">📺 Display</a>
  </div>
</body>
</html>
